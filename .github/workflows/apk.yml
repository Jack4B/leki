name: Zbuduj APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run check
      - name: Stały klucz podpisu (opcjonalnie, sekret DEBUG_KEYSTORE_BASE64)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Użyto klucza z sekretu."
          else
            echo "Brak sekretu: Gradle wygeneruje nowy klucz debug (aktualizacja na wierzch może wymagać eksportu i importu danych)."
          fi
      - name: Przygotuj projekt Androida
        run: npm run android:init
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
      - name: Zbuduj APK (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Nazwij plik według wersji
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "asystent-lekow-${VERSION}.apk"
          sha256sum "asystent-lekow-${VERSION}.apk" | tee "asystent-lekow-${VERSION}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: asystent-lekow-apk
          path: |
            asystent-lekow-*.apk
            asystent-lekow-*.apk.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: asystent-lekow-apk
      - name: Opublikuj wydanie (wersja robocza do testów)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" asystent-lekow-*.apk asystent-lekow-*.apk.sha256 \
            --repo "${{ github.repository }}" --title "Asystent leków ${{ github.ref_name }}" \
            --prerelease --generate-notes
