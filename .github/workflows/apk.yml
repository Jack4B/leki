name: Zbuduj APK

on:
  workflow_dispatch:
  push:
    branches: ['**']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK z obrazu runnera, akceptacja licencji
        run: yes | sdkmanager --licenses > /dev/null || true
      - run: npm ci
      - run: npm run check
      - name: Stały klucz podpisu (opcjonalnie, sekret DEBUG_KEYSTORE_BASE64)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Użyto klucza z sekretu."
          else
            echo "Brak sekretu: Gradle wygeneruje nowy klucz debug (aktualizacja na wierzch może wymagać eksportu i importu danych)."
          fi
      - name: Przygotuj projekt Androida
        run: npm run android:init
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
      - name: Zbuduj APK (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Nazwij plik według wersji
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "asystent-lekow-${VERSION}.apk"
          sha256sum "asystent-lekow-${VERSION}.apk" | tee "asystent-lekow-${VERSION}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: asystent-lekow-apk
          path: |
            asystent-lekow-*.apk
            asystent-lekow-*.apk.sha256

  release:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: asystent-lekow-apk
      - name: Opublikuj wydanie testowe (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          SUBJECT=$(git log -1 --format=%s "$SHA")
          # Wydanie jest nadpisywane przy każdym wypchnięciu na gałąź: tag zawsze wskazuje najnowszy build tej wersji.
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          {
            echo "Wersja testowa (preview). Plik APK do instalacji na Androidzie jest w sekcji Assets poniżej."
            echo
            echo "Commit: ${SHA:0:7} ${SUBJECT}"
            echo
            echo "Suma SHA-256 jest w pliku .sha256 obok APK."
          } > notes.md
          gh release create "$TAG" asystent-lekow-*.apk asystent-lekow-*.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Asystent leków ${VERSION}" \
            --prerelease --notes-file notes.md
