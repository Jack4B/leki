name: Zbuduj APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Opublikuj wydanie testowe (pre-release) z wybranej gałęzi'
        type: boolean
        default: false
      delete_tag:
        description: 'Usuń błędne automatyczne wydanie testowe o tym tagu (np. v0.14.4-preview-b115); tylko prerelease w formacie v<wersja>-b<numer>'
        type: string
        default: ''
  push:
    branches: ['**']
    tags: ['v*']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Moduł Cykl, testy i zgodność pliku w aplikacji ze źródłami
        working-directory: cykl
        run: |
          npm test
          cmp dist/cykl.html ../app/src/main/assets/cykl/cykl.html || { echo "::error::app/src/main/assets/cykl/cykl.html nie jest zbudowany z aktualnych źródeł (npm run build w cykl/ i skopiuj dist/cykl.html)"; exit 1; }
      - name: Android SDK z obrazu runnera, akceptacja licencji
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Klucz podpisu (klucz release z sekretów, inaczej stały klucz debug z DEBUG_KEYSTORE_BASE64, inaczej tymczasowy)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          LEKI_RELEASE_KEYSTORE_BASE64: ${{ secrets.LEKI_RELEASE_KEYSTORE_BASE64 }}
          LEKI_KEYSTORE_PASSWORD: ${{ secrets.LEKI_KEYSTORE_PASSWORD }}
          LEKI_KEY_ALIAS: ${{ secrets.LEKI_KEY_ALIAS }}
          LEKI_KEY_PASSWORD: ${{ secrets.LEKI_KEY_PASSWORD }}
        # Gradle zawsze dostaje jawną ścieżkę klucza (LEKI_KEYSTORE_PATH itd. przez GITHUB_ENV), żeby podpis nie zależał od domyślnego miejsca klucza debug.
        run: |
          mkdir -p ~/.android
          if [ -n "$LEKI_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$LEKI_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            { echo "LEKI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"; echo "LEKI_KEYSTORE_PASSWORD=$LEKI_KEYSTORE_PASSWORD"
              echo "LEKI_KEY_ALIAS=$LEKI_KEY_ALIAS"; echo "LEKI_KEY_PASSWORD=$LEKI_KEY_PASSWORD"; } >> "$GITHUB_ENV"
            echo release > key-source.txt
            echo "Użyto klucza release z sekretów."
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo stały > key-source.txt
            echo "Użyto klucza debug z sekretu."
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo tymczasowy > key-source.txt
            echo "::warning::Brak sekretów podpisu: APK podpisany nowym, tymczasowym kluczem (aktualizacja na wierzch i Obtainium nie zadziałają)."
          fi
          if [ ! -f "$RUNNER_TEMP/release.jks" ] || [ -z "$LEKI_RELEASE_KEYSTORE_BASE64" ]; then
            # klucz debug: standardowe, publicznie znane hasła debug (nie są to sekrety), podane tylko w CI
            { echo "LEKI_KEYSTORE_PATH=$HOME/.android/debug.keystore"; echo "LEKI_KEYSTORE_PASSWORD=android"
              echo "LEKI_KEY_ALIAS=androiddebugkey"; echo "LEKI_KEY_PASSWORD=android"; } >> "$GITHUB_ENV"
          fi
      - name: Testy logiki i zbudowanie APK
        run: ./gradlew checkChangelog :core:test :app:assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon
      - name: Sprawdź, że APK nie ma uprawnienia INTERNET
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2=$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then echo "::error::APK ma uprawnienie INTERNET, a aplikacja ma działać bez sieci"; exit 1; fi
      - name: Sprawdź numer kompilacji (versionCode = numer wersji * 1000 + przebieg mod 1000)
        env:
          RUN: ${{ github.run_number }}
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2=$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)
          VN=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          IFS=. read -r MA MI PA _ <<< "${VN%%-*}"
          EXPECT=$(( (10#$MA * 10000 + 10#$MI * 100 + 10#$PA) * 1000 + RUN % 1000 ))
          GOT=$("$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          echo "versionCode APK: ${GOT}, oczekiwany: ${EXPECT}"
          [ "$GOT" = "$EXPECT" ] || { echo "::error::versionCode APK (${GOT}) nie zgadza się z oczekiwanym (${EXPECT})"; exit 1; }
          # dodatkowe zabezpieczenie przed wydaniem z gałęzi bez aktualnej wersji i wzoru numeru (Obtainium odrzuca niższy versionCode)
          [ "${GOT:-0}" -ge 1000000 ] || { echo "::error::versionCode APK (${GOT}) jest poniżej 1000000: gałąź nie ma aktualnego wzoru numeru kompilacji (scal gałąź domyślną)"; exit 1; }
          GOTNAME=$("$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "versionName APK: ${GOTNAME}, w kodzie (gradle.properties): ${VN}"
          [ "$GOTNAME" = "$VN" ] || { echo "::error::versionName APK (${GOTNAME}) nie zgadza się z wersją w kodzie (${VN})"; exit 1; }
      - name: Nazwij plik według wersji
        run: |
          VERSION=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          cp app/build/outputs/apk/release/app-release.apk "asystent-lekow-${VERSION}.apk"
          sha256sum "asystent-lekow-${VERSION}.apk" | tee "asystent-lekow-${VERSION}.apk.sha256"
          # odcisk certyfikatu podpisu: ten sam w każdej wersji = aktualizacje na wierzch i Obtainium działają
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=$("$APKSIGNER" verify -v --print-certs "asystent-lekow-${VERSION}.apk" 2>&1 || true)
          echo "$OUT" | head -20
          FP=$(echo "$OUT" | grep -i 'certificate SHA-256 digest' | head -1 | sed 's/.*: *//' | tr -d ': ' | tr 'A-F' 'a-f' || true)
          KS_FILE="$LEKI_KEYSTORE_PATH"; KS_PASS="$LEKI_KEYSTORE_PASSWORD"; KS_ALIAS="$LEKI_KEY_ALIAS"
          KS=$(keytool -list -v -keystore "$KS_FILE" -storepass "$KS_PASS" -alias "$KS_ALIAS" | sed -n 's/^.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "Klucz w pliku: ${KS}"; echo "Podpis APK:    ${FP}"
          [ -n "$FP" ] || { echo "::error::Nie udało się odczytać podpisu APK"; exit 1; }
          [ "$FP" = "$KS" ] || { echo "::error::Podpis APK nie pochodzi z klucza z LEKI_KEYSTORE_PATH"; exit 1; }
          echo "klucz=$(cat key-source.txt)" > asystent-lekow-podpis.txt
          echo "sha256=${FP}" >> asystent-lekow-podpis.txt
          cat asystent-lekow-podpis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: asystent-lekow-apk
          path: |
            asystent-lekow-*.apk
            asystent-lekow-*.apk.sha256
            asystent-lekow-podpis.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raporty-testow
          path: core/build/reports/tests
          if-no-files-found: ignore

  release:
    needs: apk
    # Wydania tylko z gałęzi domyślnej albo z tagu v*; gałęzie robocze (feat/, fix/, Claude Code) kończą się na artefakcie,
    # chyba że ktoś ręcznie uruchomi workflow (Actions → Zbuduj APK → Run workflow) z zaznaczonym „Opublikuj wydanie testowe”.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    concurrency:
      group: apk-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: asystent-lekow-apk
      - name: Opublikuj wydanie testowe (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          VERSION=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          # Każdy build ma własne wydanie z unikalnym tagiem (wersja + numer przebiegu). Dzięki temu Obtainium widzi nową wersję przy każdej zmianie.
          TAG="v${VERSION}-b${RUN}"
          SUBJECT=$(git log -1 --format=%s "$SHA")
          KEY=$(sed -n 's/^klucz=//p' asystent-lekow-podpis.txt)
          FP=$(sed -n 's/^sha256=//p' asystent-lekow-podpis.txt)
          {
            echo "Wersja testowa (preview), kompilacja ${RUN}. Plik APK do instalacji na Androidzie jest w sekcji Assets poniżej."
            echo
            echo "Commit: ${SHA:0:7} ${SUBJECT}"
            echo
            if [ "$KEY" = "release" ]; then
              echo "Podpis: klucz release. Odcisk certyfikatu (SHA-256): \`${FP}\`"
            elif [ "$KEY" = "stały" ]; then
              echo "Podpis: stały klucz, można aktualizować na wierzch. Odcisk certyfikatu (SHA-256): \`${FP}\`"
            else
              echo "**Uwaga: podpis tymczasowym kluczem.** Ten APK nie zaktualizuje się na wierzch po innej kompilacji. Ustaw sekret DEBUG_KEYSTORE_BASE64 (opis w README)."
            fi
            echo
            echo "Suma SHA-256 pliku jest w pliku .sha256 obok APK."
          } > notes.md
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" asystent-lekow-*.apk asystent-lekow-*.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Asystent leków ${VERSION} (kompilacja ${RUN})" \
            --prerelease --notes-file notes.md
          # Sprzątanie: zostaje 5 ostatnich kompilacji. Usuwane są wyłącznie automatyczne wydania testowe tego workflow
          # (prerelease, tag dokładnie w formacie v<wersja>-b<numer>, nie szkic); ręczne wydania i tagi wersji nie są ruszane.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.draft | not) and (.tag_name | test("^v[0-9][0-9A-Za-z.\\-]*-b[0-9]+$"))) | [.created_at, .tag_name] | @tsv' \
            | sort -r | tail -n +6 | cut -f2 \
            | while read -r old; do echo "Usuwam stare wydanie testowe $old"; gh release delete "$old" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true; done
          # Osierocone tagi kompilacji (tag bez wydania, np. po ręcznym usunięciu wydania) też są usuwane; tylko tagi w formacie v<wersja>-b<numer>.
          TAGS=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref' | sed 's#^refs/tags/##' | grep -E -- '^v[0-9][0-9A-Za-z.-]*-b[0-9]+$' || true)
          RELS=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          echo "$TAGS" | while read -r t; do [ -n "$t" ] && { echo "$RELS" | grep -qxF -- "$t" || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true; }; done

  # Ręczne usunięcie błędnego automatycznego wydania testowego (z sesji Claude Code usuwanie wydań jest blokowane, a ten job używa tokena workflow).
  usun-wydanie:
    if: github.event_name == 'workflow_dispatch' && inputs.delete_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Usuń wydanie (tylko prerelease o tagu v<wersja>-b<numer>)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.delete_tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.-]*-b[0-9]+$ ]] || { echo "::error::Tag musi mieć format v<wersja>-b<numer>"; exit 1; }
          PRE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.prerelease and (.draft | not)') || { echo "::error::Nie ma wydania o tagu $TAG"; exit 1; }
          [ "$PRE" = "true" ] || { echo "::error::To nie jest automatyczne wydanie testowe (prerelease)"; exit 1; }
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          echo "Usunięto wydanie i tag $TAG"

  # Zrzuty ekranów do kontroli układu (nie blokują wydania). Wydanie "zrzuty-ekranow" jest nadpisywane przy każdym przebiegu.
  zrzuty:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK z obrazu runnera, akceptacja licencji
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Wygeneruj zrzuty ekranów
        run: ./gradlew :app:recordPaparazziDebug --no-daemon
      - name: Opublikuj zrzuty
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          ls -la app/src/test/snapshots/images
          gh release delete zrzuty-ekranow --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create zrzuty-ekranow app/src/test/snapshots/images/*.png --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Zrzuty ekranów (kontrola układu)" --prerelease --notes "Zrzuty ekranów z testów renderowania, odświeżane przy każdym przebiegu. Nie jest to wersja do instalacji."
