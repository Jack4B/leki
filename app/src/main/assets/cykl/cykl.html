<script>
(() => {
"use strict";
                                                             
/** Tryb prognoz: normalny, antykoncepcja hormonalna (bez prognoz płodności) albo ciąża/połóg/karmienie (bez żadnych prognoz). */
                                            
                 
               
               
                       
                          
                
                  
                   
 
                                                                                    
                    
                    
              
                      
                              
                      
                  
 
                                                                                      
                   
                                                                       
                                             
 
                                                                                  
                   
                                                                    
                                                          
                                                                 
 
                               
                   
                                                                 
                                                                        
 

const pad = (n        )         => String(n).padStart(2, "0");
const iso = (d      )         => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayIso = ()         => iso(new Date());
const at = (s        )       => new Date(`${s}T12:00:00`);
const addDays = (s        , n        )         => {
  const d = at(s);
  d.setDate(d.getDate() + n);
  return iso(d);
};
const diffDays = (a        , b        )         => Math.round((at(b).getTime() - at(a).getTime()) / 864e5);
/** Prawdziwa data kalendarzowa: odrzuca miesiąc 13 i 30 lutego (tekst musi wrócić z Date bez zmian). */
const isIsoDate = (s        )          => /^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(at(s).getTime()) && iso(at(s)) === s;
/** Polska liczba mnoga: 1 wpis, 2 wpisy, 5 wpisów. */
const plN = (n        , one        , few        , many        )         =>
  n === 1 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? few : many;

const mean = (a          )         => a.reduce((x, y) => x + y, 0) / a.length;
const median = (a          )         => {
  const s = [...a].sort((x, y) => x - y);
  const m = s.length >> 1;
  return s.length % 2 ? s[m]  : (s[m - 1]  + s[m] ) / 2;
};
const stdev = (a          )         => {
  const m = mean(a);
  return Math.sqrt(mean(a.map((x) => (x - m) ** 2)));
};
/** Theil–Sen: mediana nachyleń par punktów; odporna na wartości odstające. */
const theilSen = (y          )                                       => {
  if (y.length < 2) return { slope: 0, intercept: y[0] ?? 0 };
  const slopes           = [];
  for (let i = 0; i < y.length; i++) for (let j = i + 1; j < y.length; j++) slopes.push((y[j]  - y[i] ) / (j - i));
  const slope = median(slopes);
  const intercept = median(y.map((v, i) => v - slope * i));
  return { slope, intercept };
};



const T = {
  START: "period_start", END: "period_end", SEX: "sex", PROT: "protected",
  SOLO: "masturb", HIM: "him", LH: "lh",
}         ;

/** Typy wpisów, którymi zarządza formularz dnia; pozostałe (np. z importu) zostają nietknięte. */
const MANAGED = [
  T.START, T.END, T.SEX, T.PROT, T.SOLO, T.HIM, T.LH,
  "spotting", "clot", "flow", "pain", "painkiller", "preg_test", "note",
];

const emptyDb = ()     => ({ entries: [], cycles: {}, settings: {} });

const normDate = (s         )         => {
  const t = String(s ?? "").trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(t)) return t.slice(0, 10);
  const m = t.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);
  return m ? `${m[3]}-${pad(Number(m[2]))}-${pad(Number(m[1]))}` : "";
};

const plainObject = (x         )                          =>
  x && typeof x === "object" && !Array.isArray(x) ? (x                           ) : {};

const parseBackup = (raw         )     => {
  const data          = typeof raw === "string" ? JSON.parse(raw.replace(/^﻿/, "").trim()) : raw;
  if (!data || typeof data !== "object") throw new Error("To nie jest obiekt JSON.");
  const obj = data                           ;
  const list = Array.isArray(data) ? data : obj.entries;
  if (!Array.isArray(list)) throw new Error("Brak tablicy entries.");
  const entries          = [];
  for (const e of list                             ) {
    if (!e || e.date == null || e.type == null) continue;
    const date = normDate(e.date);
    const type = String(e.type).trim();
    if (!date || !isIsoDate(date) || !type) continue;
    const row        = { type, date };
    if (e.id != null) row.id = e.id                   ;
    if (e.value != null) row.value = e.value                   ;
    if (e.text != null) row.text = String(e.text);
    if (e.result != null) row.result = String(e.result);
    if (e.limits) row.limits = true;
    entries.push(row);
  }
  if (!entries.length) throw new Error("Zero poprawnych wpisów.");
  return { entries, cycles: plainObject(obj.cycles), settings: plainObject(obj.settings)             };
};

const entryKey = (e       )         => [e.type, e.date, e.value ?? "", e.text ?? "", e.result ?? ""].join("|");

const mergeDb = (a    , b    )                         => {
  const seen = new Set(a.entries.map(entryKey));
  const add = b.entries.filter((e) => !seen.has(entryKey(e)));
  return {
    entries: [...a.entries, ...add],
    cycles: { ...b.cycles, ...a.cycles },
    settings: { ...b.settings, ...a.settings },
    added: add.length,
  };
};

                    
                                                                                                        
                                                                                         
                                           
 

const flagsFor = (entries         , date        )           => {
  const f           = {
    start: false, end: false, sex: false, prot: false, solo: false, soloType: "him", spot: false, clot: false,
    lh: false, flow: 0, pain: 0, limits: false, test: "", note: "", pill: "",
  };
  for (const e of entries) {
    if (e.date !== date) continue;
    switch (e.type) {
      case T.START: f.start = true; break;
      case T.END: f.end = true; break;
      case T.SEX: f.sex = true; break;
      case T.PROT: f.prot = true; break;
      case T.SOLO: f.solo = true; f.soloType = "masturb"; break;
      case T.HIM: f.solo = true; f.soloType = "him"; break;
      case "spotting": f.spot = true; break;
      case "clot": f.clot = true; break;
      case T.LH: f.lh = e.result !== "neg"; break;
      case "flow": f.flow = Number(e.value) || 0; break;
      case "pain": f.pain = Number(e.value) || 0; f.limits = Boolean(e.limits); break;
      case "preg_test": f.test = e.result ?? ""; break;
      case "note": f.note = e.text ?? ""; break;
      case "painkiller": f.pill = e.text ?? ""; break;
    }
  }
  return f;
};

const hasAny = (entries         , date        , types          )          =>
  entries.some((e) => e.date === date && types.includes(e.type));

/** Czysta funkcja: przełącza jeden znacznik dnia (szybkie kafelki). */
const toggleEntry = (entries         , date        , type        )          => {
  const group = type === T.HIM ? [T.HIM, T.SOLO] : [type];
  if (hasAny(entries, date, group)) {
    let out = entries.filter((e) => !(e.date === date && group.includes(e.type)));
    if (type === T.SEX) out = out.filter((e) => !(e.date === date && e.type === T.PROT));
    return out;
  }
  const out          = [...entries, type === T.LH ? { type, date, result: "pos" } : { type, date }];
  if (type === T.PROT && !hasAny(entries, date, [T.SEX])) out.push({ type: T.SEX, date });
  return out;
};

/** Czysta funkcja: zapis pełnego formularza dnia. Zostawia wpisy nieznanych typów. */
const saveDay = (entries         , date        , form         )          => {
  const keep = entries.filter((e) => !(e.date === date && MANAGED.includes(e.type)));
  const on = new Set(form.toggles);
  for (const t of on) {
    if (t === T.HIM) keep.push({ type: form.soloType, date });

const uniqueDates = (entries         , type        )           =>
  [...new Set(entries.filter((e) => e.type === type).map((e) => e.date))].sort();

/** Koniec okresu należy do startu tylko, gdy wypada przed następnym startem. */
const endFor = (start        , next               , ends          )                =>
  ends.find((d) => d >= start && (!next || d < next)) ?? null;

/** Najkrótszy możliwy cykl: dwa „starty” bliżej niż 15 dni to zwykle podwójny wpis (liczony jest pierwszy). */
const MIN_CYCLE = 15;

const buildHistory = (entries         )          => {
  const all = uniqueDates(entries, T.START);
  const starts           = [];
  for (const d of all) { const prev = starts.at(-1); if (prev === undefined || diffDays(prev, d) >= MIN_CYCLE) starts.push(d); }
  const ends = uniqueDates(entries, T.END);
  const eps            = starts.map((start, i) => {
    const next = starts[i + 1] ?? null;
    const end = endFor(start, next, ends);
    return { start, end, next, last: end ?? start, days: end ? diffDays(start, end) + 1 : null, crossesMonth: false };
  });
  const known = eps.flatMap((e) => (e.days ? [e.days] : []));
  const bleedLen = known.length ? Math.min(8, Math.max(3, Math.round(mean(known)))) : 5;
  const bleed = new Set        ();
  for (const ep of eps) {
    let last = ep.end ?? addDays(ep.start, bleedLen - 1);
    if (ep.next && last >= ep.next) last = addDays(ep.next, -1);
    ep.last = last;
    ep.crossesMonth = ep.start.slice(0, 7) !== last.slice(0, 7);
    for (let d = ep.start; d <= last; d = addDays(d, 1)) bleed.add(d);
  }
  const cycles          = [];
  const skipped                     = [];
  starts.slice(1).forEach((end, i) => {
    const start = starts[i] ;
    const days = diffDays(start, end);
    if (days >= MIN_CYCLE && days <= 90) cycles.push({ start, end, days, bleed: eps[i] .days });
    else if (days < MIN_CYCLE) skipped.push({ start, end, days });
  });
  return { starts, ends, eps, cycles, skipped, bleed, bleedLen, lastStart: starts.at(-1) ?? null };
};




/* ---------- rozkłady dyskretne (wartość → prawdopodobieństwo) ---------- */
const normalize = (p     )      => {

const addOvulationWeights = (map                     , ovDates                     , win                      )       => {

      map.set(date, (map.get(date) ?? 0) + p * FERTILITY_BY_OFFSET[off] );

/** Początek ostatniej serii dodatnich testów LH (testy w odstępie ≤2 dni to jedna seria). */
const lhRunStart = (ds          )                => {
  let i = ds.length - 1;
  while (i > 0 && diffDays(ds[i - 1] , ds[i] ) <= 2) i--;

};

/** Rozkład ograniczony do wartości ≥ min i znormalizowany; null, gdy zostaje zaniedbywalna masa. */
const conditionOn = (p     , min        )             => {
  const f = new Map([...p].filter(([k]) => k >= min));
  const mass = [...f.values()].reduce((a, b) => a + b, 0);
  return mass < 0.02 ? null : normalize(f);
};

const predict = (hist         , entries         , settings          , today        )             => {

/** Statystyka testu Manna–Kendalla (|z|): czy kierunek zmian jest czymś więcej niż szumem. */
const mannKendallZ = (y          )         => {
  const n = y.length;
  let s = 0;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) s += Math.sign(y[j]  - y[i] );
  return Math.abs(s) / Math.sqrt((n * (n - 1) * (2 * n + 5)) / 18);

const trendOf = (lengths          )        => {

  const fitted = lengths.map((_, i) => intercept + slope * i);

};

                
                                                                                            
                                                                                        
                                                                    
                                                                                        
                                                                                                              
 
/** Dzień „w pobliżu” miesiączki (±2 dni): plamienie tuż przed startem albo po końcu to zwykle jej początek lub koniec. */
const nearBleed = (hist         , date        )          => [-2, -1, 0, 1, 2].some((k) => hist.bleed.has(addDays(date, k)));

const figoSystem1 = (hist         , entries         , settings          , today        , overdueDays        )       => {
  const since = addDays(today, -365);
  const mode = settings.mode === "hormonal" || settings.mode === "pause" ? settings.mode : "normal";
  const c12 = hist.cycles.filter((c) => c.end >= since);
  const cyc = c12.length ? c12 : hist.cycles;
  const band = settings.ageBand ?? "26-41";
  const lim = regularityLimit(band);
  const lens = cyc.map((c) => c.days);
  const avg = lens.length ? Math.round(mean(lens)) : settings.averageCycleLength ?? 29;
  const mn = lens.length ? Math.min(...lens) : avg;
  const mx = lens.length ? Math.max(...lens) : avg;
  const variation = mx - mn;
  const enoughReg = cyc.length >= 6 && lim != null;
  const regOk = enoughReg && variation <= (lim ?? 99);
  const missing90 = Boolean(hist.lastStart && diffDays(hist.lastStart, today) > 90);
  const freqOk = !missing90 && cyc.length > 0 && avg >= 24 && avg <= 38;
  const freq = missing90 ? "brak miesiączki >90 dni" : !cyc.length ? "za mało cykli" : avg < 24 ? "częsty (<24)" : avg > 38 ? "rzadki (>38)" : "norma (24–38)";
  // długość krwawienia, skrzepy, obfitość i plamienia: tylko z ostatnich 12 miesięcy (jeden dawny epizod nie świeci flagą do końca)
  const recentEps = hist.eps.filter((e) => e.start >= since);
  const bl = recentEps.flatMap((e) => (e.days ? [e.days] : []));
  const bMin = bl.length ? Math.min(...bl) : null;
  const bMax = bl.length ? Math.max(...bl) : null;
  const durOk = bMax == null || bMax <= 8;
  const epOf = (date        )         => recentEps.findIndex((e) => date >= e.start && date <= e.last);
  const outside = entries.filter((e) => ["spotting", "clot", "flow"].includes(e.type) && e.date >= since && e.date <= today && !nearBleed(hist, e.date));
  // plamienie poza okresem liczy się, gdy powtarza się w różnych cyklach (pojedyncze plamienie bywa przypadkowe)
  const cycleKey = (d        )         => [...hist.starts].reverse().find((s) => s <= d) ?? "";
  const imbAll = [...new Set(outside.map((e) => e.date))].sort();
  const imb = new Set(imbAll.map(cycleKey)).size >= 2 ? imbAll : [];
  const flowHigh = new Map                     (), clots = new Set        ();
  let limits = 0;
  for (const e of entries) {
    if (e.date < since || !hist.bleed.has(e.date)) continue;
    const ep = epOf(e.date);
    if (e.type === "clot") clots.add(ep);
    if (e.type === "pain" && e.limits) limits++;
    if (e.type === "flow" && (Number(e.value) || 0) >= 4) flowHigh.set(ep, (flowHigh.get(ep) ?? new Set()).add(e.date));
  }
  // obfite krwawienie: obfitość 4–5 w co najmniej 2 dniach jednej miesiączki albo skrzepy w co najmniej 2 miesiączkach
  const hmb = [...flowHigh.values()].some((s) => s.size >= 2) || clots.size >= 2;
  const cond = settings.health?.conditions ?? "";
  const anemia = /anemi|niedokrwisto|niedob\S*\s+żelaz|niska\s+ferryt|ferrytyn\S*\s+(niska|obniżon)/i.test(cond)
    && !/(brak|bez|wykluczon\w*|nie\s+ma|nie\s+stwierdz\w*)\s+(anemi\w*|niedokrwisto\w*)|(anemi\w*|niedokrwisto\w*)\s+(wykluczon\w*|nie\s+stwierdz\w*)/i.test(cond);
  const flowLogged = entries.some((e) => e.type === "flow" && hist.bleed.has(e.date));
  const testPos = entries.some((e) => e.type === "preg_test" && e.result === "pos" && diffDays(e.date, today) >= 0 && diffDays(e.date, today) <= 100);
  const clinic           = [];
  // krwawienie po ≥12 miesiącach bez miesiączki: w każdym wieku wymaga oceny lekarza
  for (let i = 1; i < hist.starts.length; i++) {
    if (diffDays(hist.starts[i - 1] , hist.starts[i] ) >= 365 && diffDays(hist.starts[i] , today) <= 365) {
      clinic.push(`krwawienie (${hist.starts[i]}) po ponad 12 miesiącach bez miesiączki: do oceny lekarza, także gdy jest skąpe`);
    }
  }
  if (mode !== "pause") {
    if (missing90) clinic.push("brak miesiączki >90 dni: najpierw wyklucz ciążę (test), potem omów z lekarzem");
    if (enoughReg && !regOk) clinic.push(`wahanie długości cykli ${variation} dni w ostatnich 12 miesiącach (próg ${lim}); jeśli się utrzymuje, warto omówić`);
    // pojedynczy cykl poza 24–38 dniami to jeszcze nie nieprawidłowość: liczy się powtarzanie się (≥2 z ostatnich 6) albo mediana poza zakresem
    const last6 = cyc.slice(-6), outLast6 = last6.filter((c) => c.days < 24 || c.days > 38);
    const med = lens.length ? median(lens) : null;
    if (outLast6.length >= 2 || (cyc.length >= 3 && med != null && (med < 24 || med > 38))) {
      clinic.push(`cykle poza zakresem 24–38 dni: ${outLast6.length} z ostatnich ${last6.length} (${outLast6.map((c) => `${c.start} → ${c.end}: ${c.days} d`).join("; ")})`);
    }
    if (overdueDays > 7) clinic.push(`okres spóźniony o ${overdueDays} dni poza własnym typowym zakresem: jeśli był stosunek, zrób test ciążowy`);
  }
  if (testPos) clinic.push("dodatni test ciążowy w dzienniku: umów wizytę u lekarza lub położnej");
  if (bMax != null && bMax > 8) clinic.push("krwawienie >8 dni");
  if (imb.length) clinic.push(`plamienie/skrzepy poza okresem w kilku cyklach: ${imb.join(", ")}`);
  if (hmb) clinic.push("sygnał obfitego krwawienia (obfitość 4–5 przez kilka dni albo skrzepy w kilku miesiączkach; opis, nie pomiar ml)");
  if (limits >= 2) clinic.push("ból w czasie miesiączki, który psuje sen albo pracę, w kilku dniach: warto omówić");
  if (anemia && (hmb || (bMax != null && bMax > 7))) clinic.push("anemia przy sygnałach obfitego krwawienia: warto ustalić z lekarzem, czy miesiączki nie pogłębiają niedoboru żelaza");
  const urgent = missing90 && mode !== "pause" || testPos;
  const urgentWhy = missing90 && mode !== "pause" ? "brak miesiączki >90 dni (najpierw wyklucz ciążę testem)" : testPos ? "dodatni test ciążowy w dzienniku" : "";
  return { avg, mn, mx, variation, lim, band, enoughReg, regOk, freq, freqOk, bMin, bMax, durOk, imb, hmb, clinic,
    urgent, urgentWhy, nCycles: cyc.length, anemia, flowLogged };
};









                   
                                                                                                                                          
 
                    
                                                                                       
                                                           
                                                        
                                  
 

const analyze = (db    , today        )           => {
  const hist = buildHistory(db.entries);
  const pred = predict(hist, db.entries, db.settings, today);
  const lhDays = new Set(db.entries.filter((e) => e.type === "lh" && e.result !== "neg").map((e) => e.date));
  const cycleDay = hist.lastStart && diffDays(hist.lastStart, today) >= 0 ? diffDays(hist.lastStart, today) + 1 : 0;
  const predBleed = new Set        ();
  for (const p of pred.nextPeriods) for (let i = 0; i < hist.bleedLen; i++) predBleed.add(addDays(p.date, i));
  const lastBleed = hist.eps.at(-1)?.last ?? null;
  const info = (date        )          => {
    const bleed = hist.bleed.has(date);
    const f = fertilityOn(pred, date);
    const q = windowOn(pred, date);
    let level = windowLevel(q);
    // metoda kalendarzowa (od 6 cykli; najkrótszy cykl − 18 do najdłuższy − 11, licząc od ostatniego startu): dni w tym zakresie są co najmniej „możliwe”,
    // bo przy nieregularnych cyklach wytyczne nie pozwalają wskazać bezpiecznych dni w środku cyklu
    // bez historii (mniej niż 3 cykle) i bez testu LH model opiera się tylko na populacyjnym priorze: szczyt okna nie jest wtedy pokazywany jako „wysokie ryzyko”
    if (level === "high" && hist.cycles.length < 3 && !pred.lhUsed && date >= today) level = "mid";
    const cal = pred.calendar;
    const inCal = Boolean(cal && hist.lastStart && date >= addDays(hist.lastStart, cal.from - 1) && date <= addDays(hist.lastStart, cal.to - 1));
    if (inCal && level === "low" && !hist.bleed.has(date)) level = "mid";
    return {
      bleed, predBleed: !bleed && predBleed.has(date) && (!lastBleed || date > lastBleed),
      fertility: f, window: q, level, calendar: inCal, ovulation: pred.expectedOvulation === date, lh: lhDays.has(date),
    };
  };
  const t = info(today);
  const sinceStart = cycleDay ? cycleDay - 1 : 0;
  let phase = "Faza cyklu niepewna";
  if (!hist.lastStart) phase = "Brak danych";
  else if (pred.mode === "pause") phase = "Prognozy wyłączone";
  else if (t.bleed) phase = "Miesiączka";
  else if (pred.overdueDays > 0) phase = "Okres się spóźnia";
  else if (pred.noForecast) phase = "Brak prognozy";
  else if (pred.mode === "hormonal") phase = "Antykoncepcja hormonalna";
  else if (t.level === "high") phase = "Okno płodne";
  else if (t.level === "mid") phase = "Możliwe okno płodne";
  else if (sinceStart >= pred.lengthMedian) phase = "Okres spodziewany";
  else if (pred.expectedOvulation && today > addDays(pred.expectedOvulation, 1)) phase = "Po szacowanej owulacji";
  else if (pred.expectedOvulation) phase = "Przed szacowaną owulacją";
  return {
    today, entries: db.entries, settings: db.settings, hist, pred,
    figo: figoSystem1(hist, db.entries, db.settings, today, pred.overdueDays),
    straw: strawHint(hist, today, db.settings.ageBand ?? "26-41", pred.mode), trend: trendOf(hist.cycles.map((c) => c.days)),
    cycleDay, phase, todayLevel: t.level, lhDays, info,
  };
};





                    
                                                                                 
                                                 
 
/** "W ryzyku" = stosunek w dniu, w którym okno płodne jest co najmniej możliwe (poziom „możliwe” lub „bardzo prawdopodobne” w kalendarzu). */
const intimacyOf = (a          )           => {
  const sex = new Set        (), prot = new Set        (), solo = new Set        ();
  for (const e of a.entries) {
    if (e.type === T.SEX) sex.add(e.date);
    if (e.type === T.PROT) prot.add(e.date);
    if (e.type === T.SOLO || e.type === T.HIM) solo.add(e.date);
  }
  const days = [...sex];
  const secured = days.filter((d) => prot.has(d)).length;
  const risk = days.filter((d) => a.info(d).level !== "low");
  return {
    sex: days.length, protected: secured, unprotected: days.length - secured, solo: solo.size,
    pct: days.length ? Math.round((secured / days.length) * 100) : 0,
    unprotectedAtRisk: risk.filter((d) => !prot.has(d)).length, atRiskTotal: risk.length,
  };
};

                                                                                            
const monthlyOf = (a          )             => {
  const by = new Map                                                                                   ();
  const row = (ym        ) => { let r = by.get(ym); if (!r) { r = { sex: new Set(), prot: new Set(), solo: new Set(), bleed: 0 }; by.set(ym, r); } return r; };
  for (const e of a.entries) {
    const ym = e.date.slice(0, 7);
    if (!/^\d{4}-\d{2}$/.test(ym)) continue;
    const r = row(ym);
    if (e.type === T.SEX) r.sex.add(e.date);
    if (e.type === T.PROT) r.prot.add(e.date);
    if (e.type === T.SOLO || e.type === T.HIM) r.solo.add(e.date);
  }
  for (const d of a.hist.bleed) row(d.slice(0, 7)).bleed++;
  return [...by].sort(([x], [y]) => x.localeCompare(y)).map(([month, r]) => ({
    month, sex: r.sex.size, prot: [...r.prot].filter((d) => r.sex.has(d)).length, solo: r.solo.size, bleed: r.bleed,
  }));
};

                   
                                                              
                                                                                       
 
/** Jeden rząd na cykl: okres, okno płodne wyliczone wstecz (owulacja ≈ koniec − 14), stosunki. */
const lanesOf = (a          )            => {
  const h          = a.hist;
  const rows            = [];
  const sexDates = a.entries.filter((e) => e.type === T.SEX).map((e) => e.date);
  const prot = new Set(a.entries.filter((e) => e.type === T.PROT).map((e) => e.date));
  const solo = a.entries.filter((e) => e.type === T.SOLO || e.type === T.HIM).map((e) => e.date);
  h.starts.forEach((start, i) => {
    const next = h.starts[i + 1] ?? null;
    const length = next ? diffDays(start, next) : diffDays(start, a.today) + 1;
    if (length < 1) return;                      // start okresu w przyszłości: bez rzędu (ujemna szerokość)
    if (next && length < 15) return;
    const ep = h.eps[i] ;
    const bleed = ep.days ?? h.bleedLen;
    const ov = length - 14;
    const winFrom = Math.max(bleed, ov - 5);
    const win                          = next && ov + 1 >= winFrom ? [winFrom, ov + 1] : null;
    const inCycle = (d        ) => d >= start && (!next || d < next);
    rows.push({
      start, length, open: !next, bleed, win,
      events: sexDates.filter(inCycle).map((d) => ({ day: diffDays(start, d), prot: prot.has(d) })),
      solo: solo.filter(inCycle).length,
    });
  });
  return rows;
};

const INTIMATE = new Set        ([T.SEX, T.PROT, T.SOLO, T.HIM]);

const buildBrief = (a          , db    , withDates = false)         => {
  const f = a.figo, t = a.trend, hl = db.settings.health ?? {};
  const mode = a.pred.mode;
  const L           = [
    "# Brief cyklu (FIGO System 1 — objawy, nie przyczyny)",
    `Eksport: ${a.today} · wpisów: ${a.entries.filter((e) => !INTIMATE.has(e.type)).length} · startów: ${a.hist.starts.length}`,
    `Wiek (pasmo): ${f.band === "51+" ? "powyżej 50" : f.band} lat · tryb prognoz: ${MODE_TXT[mode]}`,
    "To nie jest rozpoznanie. Normy: FIGO 2018 (częstość 24–38 d, czas ≤8 d, wahanie ≤7 d w wieku 26–41, ≤9 d w 18–25 i 42–45; po 45. roku życia regularność nie jest oceniana).",
  ];
  if (hl.conditions || hl.meds || hl.tsh || hl.labs) {
    L.push("", "## Kontekst zdrowotny (wpisane ręcznie, rozpoznane przez lekarza)");
    if (hl.conditions) L.push(`- Choroby: ${hl.conditions}`);
    if (hl.meds) L.push(`- Leki: ${hl.meds}`);
    if (hl.tsh) L.push(`- Ostatnie TSH: ${hl.tsh}`);
    if (hl.labs) L.push(`- Morfologia / ferrytyna: ${hl.labs}`);
  }
  L.push("", "## Do gabinetu", ...(f.clinic.length ? f.clinic.map((x) => `- ${x}`) : ["- brak czerwonych flag w dzienniku"]));
  L.push("", "## Osie",
    `- Częstość: średnia ${f.avg} d — ${f.freq}`,
    `- Regularność: ${f.mn}–${f.mx}, wahanie ${f.variation} d (${f.lim == null ? "w tym wieku nie oceniana" : `próg ${f.lim}${f.enoughReg ? "" : ", za mało cykli do oceny (od 6)"}`})`,
    `- Czas trwania: ${f.bMin == null ? "brak końców okresu" : `${f.bMin}–${f.bMax} d`}`,
    `- Plamienie poza okresem: ${f.imb.length ? f.imb.join(", ") : "brak powtarzających się wpisów"}`);
  L.push("", "## Trend i faza przejściowa",
    t.direction === "unknown" ? "- za mało cykli na trend (od 6)" : t.direction === "stable" ? "- bez wyraźnego trendu długości cykli" : `- Trend długości cykli (Theil–Sen): ${t.slope >= 0 ? "+" : ""}${t.slope.toFixed(1)} d na cykl; ostatnie 3 cykle średnio ${t.recent3?.toFixed(0)} d${t.prev3 != null ? `, poprzednie 3: ${t.prev3.toFixed(0)} d` : ""}`,
    `- STRAW+10: ${a.straw.text}`);
  L.push("", "## Cykle (start → następny start)", ...a.hist.cycles.map((c) => `- ${c.start} → ${c.end}: ${c.days} d${c.bleed ? `, krwawienie ${c.bleed} d` : ""}`));
  // informacje o stosunkach tylko na wyraźne życzenie (opcja „Dołącz informacje o stosunkach”); wpisy solo nigdy
  if (withDates) {
    const i = intimacyOf(a);
    L.push("", "## Stosunki (dołączone na życzenie)", `- Liczba: ${i.sex}, z zabezpieczeniem: ${i.protected} (${i.pct}%)`);
    [...a.entries].filter((e) => e.type === T.SEX || e.type === T.PROT).sort((x, y) => x.date.localeCompare(y.date) || x.type.localeCompare(y.type))
      .forEach((e) => L.push(`- ${e.date}: ${e.type === T.SEX ? "stosunek" : "zabezpieczenie"}`));
  }
  return L.join("\n");
};

/** Bezpieczne szablony: wszystko, co nie jest SafeHtml, jest escapowane. */
class SafeHtml {
  value        ;
  constructor(value        ) { this.value = value; }
  toString()         { return this.value; }
}
const esc = (s         )         =>
  String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c] );
const raw = (s        )           => new SafeHtml(s);
const part = (v         )         => {
  if (v == null || v === false) return "";
  if (v instanceof SafeHtml) return v.value;
  if (Array.isArray(v)) return v.map(part).join("");
  return esc(v);
};
const html = (strings                      , ...vals           )           => {
  let out = strings[0] ?? "";
  vals.forEach((v, i) => { out += part(v) + (strings[i + 1] ?? ""); });
  return new SafeHtml(out);
};








/** Przesuwny wykres długości cykli: pasmo normy 24–38, średnia krocząca, trend Theil–Sen. */
const cycleChart = (cycles         , offset        , selected               )           => {
  const bw = 44, left = 30, H = 170, top = 16, bottom = 26;
  const n = cycles.length;
  if (!n) return html`<p class="mute">Za mało pełnych cykli.</p>`;
  const W = left + n * bw + 8;
  const mx = Math.max(52, ...cycles.map((c) => c.days + 4));
  const y = (v        )         => top + (H - top - bottom) * (1 - v / mx);
  const lens = cycles.map((c) => c.days);
  const ts = theilSen(lens);
  const bars = cycles.map((c, i) => {
    const x = left + i * bw;
    const bad = c.days < 24 || c.days > 38;
    const idx = offset + i;
    return html`<g class="hit" data-act="cyc" data-i="${idx}" role="button" tabindex="0" aria-label="Cykl ${c.start}, ${c.days} dni">
      <rect x="${x}" y="0" width="${bw}" height="${H}" class="${idx === selected ? "sel" : "nohit"}"/>
      <rect x="${x + 6}" y="${y(c.days)}" width="${bw - 12}" height="${y(0) - y(c.days)}" rx="5" class="bar${bad ? " bad" : ""}"/>
      <text x="${x + bw / 2}" y="${y(c.days) - 4}" text-anchor="middle" class="val">${c.days}</text>
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" class="ax">${c.start.slice(5, 7)}/${c.start.slice(2, 4)}</text></g>`;
  });
  const ma = lens.map((_, i) => {
    const w = lens.slice(Math.max(0, i - 2), i + 1);
    return `${left + i * bw + bw / 2},${y(w.reduce((a, b) => a + b, 0) / w.length)}`;
  }).join(" ");
  const grid = [0, 14, 28, 42].map((v) => html`<text x="0" y="${y(v) + 4}" class="ax">${v}</text>`);
  return html`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Długości cykli, wykres przewijany w poziomie">
    <rect x="${left}" y="${y(38)}" width="${W - left}" height="${y(24) - y(38)}" class="band"/>
    ${grid}${bars}
    <polyline points="${ma}" class="ma" fill="none"/>
    ${n >= 4 ? raw(`<line x1="${left + bw / 2}" y1="${y(ts.intercept)}" x2="${left + (n - 1) * bw + bw / 2}" y2="${y(ts.intercept + ts.slope * (n - 1))}" class="trendline"/>`) : ""}
  </svg>`;
};

/** Oś cykli: każdy cykl jako rząd (okres, okno płodne wstecz, stosunki). */
const lanes = (rows           )           => {
  const W = 300, maxLen = Math.max(50, ...rows.map((r) => r.length + 6)), sc = W / maxLen;
  const out = [...rows].reverse().map((r) => {
    const dots = r.events.map((e) => html`<circle cx="${(e.day + 0.5) * sc}" cy="10" r="3.6" class="${e.prot ? "ev prot" : "ev"}"/>`);
    const win = r.win ? html`<rect x="${r.win[0] * sc}" y="7" width="${(r.win[1] - r.win[0] + 1) * sc}" height="6" class="winb"/>` : "";
    return html`<div class="lane"><span class="lane-l">${r.start.slice(5, 7)}/${r.start.slice(2, 4)}</span>
      <svg viewBox="0 0 ${W} 20" width="100%" height="20" role="img" aria-label="Cykl od ${r.start}, ${r.length} dni">
        <rect x="0" y="7" width="${r.length * sc}" height="6" rx="3" class="track"/>
        <rect x="0" y="7" width="${r.bleed * sc}" height="6" rx="3" class="bleedb"/>${win}${dots}
        ${r.open ? raw(`<text x="${r.length * sc + 4}" y="14" class="ax">trwa</text>`) : ""}</svg></div>`;
  });
  return html`${out}`;
};

/** Pasek na najbliższe dni: wysokość = względna szansa poczęcia, kolor = poziom okna płodnego. */
const strip = (a          , days = 21)           => {
  const bars = Array.from({ length: days }, (_, i) => {
    const d = addDays(a.today, i);
    const inf = a.info(d);
    const h = Math.max(4, Math.min(1, inf.fertility / MAX_FERTILITY) * 56);
    const lv = inf.bleed ? "bleed" : inf.level;
    return html`<button class="sb" data-act="day" data-date="${d}" aria-label="${d}, szansa: ${lv}">
      <span class="sbar-wrap"><span class="sbar lv-${lv}" style="height:${h}px"></span></span>
      <span class="sl">${i === 0 ? "dziś" : d.slice(8)}</span></button>`;
  });
  return html`<div class="strip">${bars}</div>`;
};

/** Kółko cyklu: okres, dni z podwyższoną szansą, znacznik dzisiaj. */
const ring = (a          )           => {
  const last = a.hist.lastStart;
  if (!last) return html`<svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="80" class="rtrack"/></svg>`;
  const L = Math.max(a.pred.lengthMedian, a.cycleDay, 20), r = 80, C = 2 * Math.PI * r, per = C / L;
  const arcs             = [html`<circle cx="110" cy="110" r="${r}" class="rtrack"/>`];
  for (let d = 0; d < L; d++) {
    const inf = a.info(addDays(last, d));
    const cls = inf.bleed ? "rbleed" : inf.level === "high" ? "rhigh" : inf.level === "mid" ? "rmid" : "";
    if (cls) arcs.push(html`<circle cx="110" cy="110" r="${r}" class="${cls}" stroke-dasharray="${per} ${C}" stroke-dashoffset="${-d * per}" transform="rotate(-90 110 110)"/>`);
  }
  const ang = ((a.cycleDay - 0.5) / L) * 2 * Math.PI - Math.PI / 2;
  arcs.push(html`<circle cx="${110 + r * Math.cos(ang)}" cy="${110 + r * Math.sin(ang)}" r="11" class="rnow"/>`);
  return html`<svg viewBox="0 0 220 220" aria-hidden="true">${arcs}</svg>`;
};

/** Przesuwny wykres miesięczny: stosunki i solo. */
const monthChart = (rows            )           => {
  if (!rows.length) return html`<p class="mute">Brak danych.</p>`;
  const bw = 46, left = 4, H = 130, top = 14, bottom = 22, W = left + rows.length * bw + 4;
  const mx = Math.max(3, ...rows.map((r) => Math.max(r.sex, r.solo)));
  const y = (v        )         => top + (H - top - bottom) * (1 - v / mx);
  const g = rows.map((r, i) => {
    const x = left + i * bw;
    return html`<g><rect x="${x + 5}" y="${y(r.sex)}" width="16" height="${y(0) - y(r.sex)}" rx="3" class="mb-sex"/>
      <rect x="${x + 24}" y="${y(r.solo)}" width="16" height="${y(0) - y(r.solo)}" rx="3" class="mb-solo"/>
      ${r.sex ? raw(`<text x="${x + 13}" y="${y(r.sex) - 3}" text-anchor="middle" class="val">${r.sex}</text>`) : ""}
      ${r.solo ? raw(`<text x="${x + 32}" y="${y(r.solo) - 3}" text-anchor="middle" class="val">${r.solo}</text>`) : ""}
      <text x="${x + 23}" y="${H - 6}" text-anchor="middle" class="ax">${r.month.slice(5)}/${r.month.slice(2, 4)}</text></g>`;
  });
  return html`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stosunki i solo wg miesięcy">${g}</svg>`;
};












                                           
                   
                                                                                                                           
                                                                                             
                 
 

const dfmt = (date        , o                             = { day: "numeric", month: "short" })         =>
  new Date(`${date}T12:00:00`).toLocaleDateString("pl-PL", o);
const range = (a        , b        )         => (a === b ? dfmt(a) : `${dfmt(a)} – ${dfmt(b)}`);
const inDays = (date        , today        )         => {
  const n = diffDays(today, date);
  return n === 0 ? "dziś" : n === 1 ? "jutro" : n > 0 ? `za ${n} dni` : `${-n} dni temu`;
};
const THEME_LABEL                        = { auto: "Auto", light: "Jasny", dark: "Ciemny" };

const top = (title        , sub        , theme       )           => html`

const viewToday = (a          , s         )           => {
  const t = s.today;

    : p.noForecast ? ["low", "Brak prognozy: okres spóźniony bardziej niż w dotychczasowych cyklach"]
    : p.mode === "hormonal" ? ["low", "Szansa poczęcia: prognoza wyłączona (antykoncepcja hormonalna)"]
    : inf.level === "high" ? ["high", "Dziś wysokie ryzyko poczęcia (szczyt okna płodnego)"]
    : inf.level === "mid" ? ["mid", inf.calendar ? "Dziś w oknie płodnym wg metody kalendarzowej (możliwe poczęcie)" : "Dziś w oknie płodnym (możliwe poczęcie)"] : ["low", "Dziś poza przewidywanym oknem płodnym (poczęcie nadal możliwe)"];
  const age = a.settings.ageBand ?? "26-41";
  const conf = p.confidence === "high" ? "Pewność prognozy: wysoka, cykle są regularne."

    : `Pewność prognozy: niska (${a.hist.cycles.length < 3 ? "mało zapisanych cykli" : "cykle bardzo się różnią"}). Zwykle ${p.lengthMedian} d, w 80% przypadków ${p.lengthLow}–${p.lengthHigh} d, więc szansa jest rozłożona szeroko. Test LH da pewniejszy sygnał.`;
  const ageNote = age === "46-50" || age === "51+"
    ? html`<p class="note left">W tym wieku cykle bywają bezowulacyjne i nieregularne, więc prognoza jest mniej pewna, a poczęcie nadal możliwe. Wytyczne zwykle zalecają stosowanie antykoncepcji do 12 miesięcy bez miesiączki po 50. roku życia (do 24 miesięcy przed 50.). Dotyczy to metod niehormonalnych: przy hormonalnych (brak miesiączki nic wtedy nie mówi o menopauzie) decyduje lekarz.</p>` : "";
  const cal = p.calendar, lastStart = a.hist.lastStart ;
  const calTxt = p.mode !== "normal" ? "" : cal
    ? html`<p class="note left">Metoda kalendarzowa (z ${cal.n} ostatnich cykli: najkrótszy − 18 do najdłuższy − 11): dni ${cal.from}–${cal.to} cyklu, czyli ${range(addDays(lastStart, cal.from - 1), addDays(lastStart, cal.to - 1))}. ${cal.standardDays ? "Ostatnie 6 cykli mają 26–32 dni, więc metoda dni standardowych wskazuje dni 8–19. " : "Przy różnych długościach cykli okno jest szerokie. "}To kontrola obok modelu, nie dokładniejsza prognoza.</p>`
    : html`<p class="note left">Metoda kalendarzowa (najkrótszy cykl − 18 do najdłuższy − 11) wymaga co najmniej 6 zapisanych cykli (teraz: ${a.hist.cycles.length}).</p>`;
  const np = p.nextPeriods[0], run = p.nextRun;
  const rangeTxt = !np || np.from === np.to ? "" : html`<br>80%: ${range(np.from, np.to)}`;
  const overdueHint = p.overdueDays > 0 && t0 !== "pos" && t0 !== "neg" ? html`<p class="note left">Jeśli był stosunek, rozważ test ciążowy. Przy ujemnym teście i dalszym braku okresu powtórz test po kilku dniach lub skontaktuj się z lekarzem.</p>` : "";
  return html`${head}
    <section class="card hero" aria-label="Stan cyklu">
      <div class="ringbox">${ring(a)}<div class="ringc"><b>${a.cycleDay}</b><span>dzień cyklu</span></div></div>
      <div class="phase">${a.phase}</div>
      <div class="mute">typowo ${p.lengthMedian} d (w 80% przypadków ${p.lengthLow}–${p.lengthHigh})</div>

      <p class="note left">${conf}</p>${calTxt}${overdueHint}${ageNote}
      <p class="note left">Prognoza z dziennika nie jest metodą antykoncepcji ani dowodem ciąży lub jej braku.</p>
    </section>
    <div class="grid2">
      <div class="stat"><small>Następny okres</small><strong>${np ? dfmt(np.date) : "—"}</strong><span>${np ? html`${inDays(np.date, t)}${rangeTxt}` : "brak prognozy"}</span></div>
      <div class="stat"><small>Okno płodne (≥20%)</small><strong>${run ? range(run.from, run.to) : "—"}</strong>
        <span>${run ? html`${run.from <= t ? "trwa" : inDays(run.from, t)}<br>szczyt ok. ${dfmt(run.peak)}` : p.mode !== "normal" || p.noForecast ? "prognoza wyłączona lub niedostępna" : "brak w 90 dniach"}</span></div>
    </div>
    ${inf.bleed && a.figo.anemia && f.flow === 0 ? html`<div class="warn"><b>Zapisz obfitość dzisiaj.</b> Przy anemii lekarz zapyta o ilość krwawienia, a zapis z dnia jest dokładniejszy niż pamięć.
      <button class="btn sec" data-act="day" data-date="${t}">Zapisz obfitość</button></div>` : ""}
    <section class="card"><h2>Najbliższe 21 dni</h2>${strip(a)}
      <div class="legend"><span><i class="sw lv-high"></i>wysokie ryzyko (szczyt okna)</span><span><i class="sw lv-mid"></i>okno płodne (możliwe)</span><span><i class="sw lv-low"></i>okno mało prawdopodobne (&lt;20%)</span><span><i class="sw lv-bleed"></i>okres</span></div>
      <p class="note">Kolor pokazuje, czy dzień wypada w oknie płodnym (około 6 dni kończących się w dniu owulacji: plemniki żyją do 5 dni, komórka jajowa około doby). „Wysokie ryzyko” to dni, w których z co najmniej 50% prawdopodobieństwem jest szczyt okna, „okno płodne (możliwe)” to 20–50% albo dni z zakresu metody kalendarzowej (od 6 cykli). Przy nieregularnych cyklach okno jest szerokie: wytyczne nie pozwalają wtedy wskazać bezpiecznych dni. Wysokość słupka to względna szansa poczęcia przy stosunku w tym dniu (największa tuż przed owulacją). Przy nieregularnych cyklach okno jest szerokie, a dni „bardzo prawdopodobnych” może nie być wcale.</p></section>

      <button class="btn sec" data-act="day" data-date="${t}">Więcej: ból, obfitość, notatka</button></section>

};

      <span><i class="dot sex"></i>stosunek</span><span><i class="dot solo"></i>solo</span><span><i class="dot spot"></i>plamienie</span><span><i class="dot lh"></i>test LH+</span></div>

};

    <section class="card"><h2>Trend i faza przejściowa</h2><p>${dirTxt}${cmp}</p>
      <div class="${a.straw.stage === "none" ? "okbox" : "warn"}">${a.straw.text}</div>
      <p class="note">STRAW+10 to kryteria stadiów starzenia reprodukcyjnego (Harlow i wsp., 2012). Tu tylko wskazówka z dziennika, ocena należy do lekarza.</p></section>

      <label class="lab" for="lut">Faza lutealna (dni)</label>

    <section class="card"><h2>Raport dla lekarza / AI</h2>
      <label class="check"><input type="checkbox" id="wd" data-change="dates"${s.withDates ? raw(" checked") : ""}> Dołącz informacje o stosunkach (domyślnie wyłączone)</label>
      <textarea id="brief" rows="10" readonly>${brief}</textarea>

const tog = (t        , label        , on         )           => html`<button type="button" class="tog${on ? " on" : ""}" data-tog="${t}" aria-pressed="${on}">${label}</button>`;
const seg = (name        , max        , val        )           => html`<span class="lab" id="seg-${name}">${name}</span><div class="seg" data-seg="${name}" role="group" aria-labelledby="seg-${name}">

const sheetDay = (a          , date        )           => {
  const f = flagsFor(a.entries, date), i = a.info(date);
  const tags = [i.bleed && "okres", i.predBleed && "prognoza okresu", i.level === "high" && `wysokie ryzyko, szczyt okna płodnego (ok. ${Math.round(i.window * 100)}%)`, i.level === "mid" && (i.window >= WIN_MID ? `okno płodne możliwe (ok. ${Math.min(49, Math.round(i.window * 100))}%)` : "okno płodne wg metody kalendarzowej"), i.ovulation && "owulacja (szac.)"].filter(Boolean).join(" · ");
  return html`<h2>${dfmt(date, { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</h2>${tags ? html`<p class="mute">${tags}</p>` : ""}
    <input type="hidden" id="solotype" value="${f.soloType}">
    <div class="togs">${tog("period_start", "Start okresu", f.start)}${tog("period_end", "Koniec okresu", f.end)}${tog("spotting", "Plamienie", f.spot)}${tog("clot", "Skrzepy", f.clot)}
      ${tog("sex", "Stosunek", f.sex)}${tog("protected", "Zabezpieczenie", f.prot)}${tog("him", "Solo — partner/ka", f.solo)}${tog("lh", "Test LH +", f.lh)}</div>
    ${seg("Obfitość", 5, f.flow)}${seg("Ból", 10, f.pain)}
    <label class="check"><input type="checkbox" id="lim"${f.limits ? raw(" checked") : ""}> Ból psuje sen albo pracę</label>
    <input type="text" id="pill" aria-label="Lek, dawka" placeholder="Lek, dawka" value="${f.pill}">
    <span class="lab" id="seg-test">Test ciążowy</span><div class="seg" data-seg="test" role="group" aria-labelledby="seg-test">
      <button type="button" data-v="" aria-pressed="${!f.test}" class="${!f.test ? "on" : ""}">brak</button><button type="button" data-v="neg" aria-pressed="${f.test === "neg"}" class="${f.test === "neg" ? "on" : ""}">ujemny</button><button type="button" data-v="pos" aria-pressed="${f.test === "pos"}" class="${f.test === "pos" ? "on" : ""}">dodatni</button></div>
    <textarea id="note" rows="3" aria-label="Notatka dnia" placeholder="Notatka dnia">${f.note}</textarea>
    <button class="btn" data-act="save-day" data-date="${date}">Zapisz</button><button class="btn sec" data-act="close">Anuluj</button>`;
};
const sheetImport = (incoming        , current        , host = false)           => html`<h2>Wczytać ${incoming} ${plN(incoming, "wpis", "wpisy", "wpisów")}?</h2>
  <p class="mute">Teraz w aplikacji: ${current} ${plN(current, "wpis", "wpisy", "wpisów")}.</p><button class="btn" data-act="merge">Połącz (dodaj brakujące)</button>
  <button class="btn sec" data-act="replace">Zastąp wszystko</button><button class="btn sec" data-act="close">Anuluj</button>
  <p class="note">${host ? "Przed zastąpieniem aplikacja zachowuje poprzednią wersję dziennika: można ją przywrócić w Ustawienia → Moduł Cykl." : "Przed zastąpieniem aplikacja zachowuje poprzednią wersję danych w pamięci przeglądarki."}</p>`;
const sheetWipe = (host = false)           => html`<h2>Usunąć dziennik cyklu?</h2><p class="mute">${host ? "Przed usunięciem zostaje poprzednia wersja dziennika: można ją przywrócić w Ustawienia → Moduł Cykl. Zrób też kopię w Ustawienia → Kopie zapasowe i dane." : "Tej operacji nie da się cofnąć. Najpierw pobierz kopię."}</p>

const renderTab = (s         )           => {
  const a = analyze(s.db, s.today);
  return s.tab === "dzis" ? viewToday(a, s) : s.tab === "kal" ? viewCalendar(a, s) : s.tab === "wyk" ? viewCharts(a, s) : viewData(a, s);
};
const shiftMonth = (month        , by        )         => {
  const [y, m] = month.split("-").map(Number)                    ;
  const d = new Date(y, m - 1 + by, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
};










const $ = (id        )                     => document.getElementById(id);

const start = ()       => {
  const app = $("app") , sheet = $("sheet") , mask = $("mask") , toastEl = $("toast") ;
  const store = window.localStorage;
  const today = todayIso();
  const state          = {
    db: loadDb(store), tab: "dzis", month: today.slice(0, 7), range: 12, selCycle: null,
    today, theme: loadTheme(store), withDates: false, host: document.documentElement.getAttribute("data-host") === "leki",
  };
  const undo = new UndoStack();
  let pending            = null;
  let pickedFile              = null;
  let forceEnd = false;

  /* ---------- motyw ---------- */
  const applyTheme = ()       => {
    const root = document.documentElement;
    if (state.theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", state.theme);
    const bg = getComputedStyle(root).getPropertyValue("--bg").trim();
    $("tc")?.setAttribute("content", bg || "#f6f1ea");
  };
  const embedded = window.parent !== window;
  const setTheme = (t       , fromHost = false)       => {
    state.theme = t; saveTheme(store, t); applyTheme(); render();
    if (embedded && !fromHost) window.parent.postMessage({ type: "cykl-theme-changed", theme: t }, "*");
  };
  /* osadzenie w aplikacji nadrzędnej: przyjmujemy tylko motyw i tylko od rodzica */
  window.addEventListener("message", (e              ) => {
    const d = e.data                                            ;
    if (e.source !== window.parent || !d || d.type !== "cykl-theme") return;
    if (d.theme === "auto" || d.theme === "light" || d.theme === "dark") setTheme(d.theme, true);
  });

  /* ---------- UI pomocnicze ---------- */
  let toastTimer = 0;
  const toast = (msg        , withUndo = false)       => {
    toastEl.textContent = withUndo && undo.size ? `${msg} ` : msg;
    if (withUndo && undo.size) {
      const b = document.createElement("button");
      b.textContent = "Cofnij"; b.setAttribute("data-act", "undo"); b.className = "toast-btn";
      toastEl.appendChild(b);
    }
    toastEl.className = "toast show";
    clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => { toastEl.className = "toast"; }, withUndo ? 9000 : 2600);
  };
  const showSheet = (h                   )       => {
    // komunikat z „Cofnij” nie może wisieć nad otwartym oknem i zmieniać danych pod otwartym formularzem
    toastEl.className = "toast"; clearTimeout(toastTimer);
    sheet.innerHTML = `<div class="grab"></div>${h.value}`; sheet.hidden = false; mask.hidden = false;
  };
  const closeSheet = ()       => { sheet.hidden = true; mask.hidden = true; };
  const persist = ()          => { const ok = saveDb(store, state.db); if (!ok) toast("Nie udało się zapisać danych. Zrób kopię."); return ok; };
  const download = (name        , text        , mime        )       => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  /** Pola tekstowe karty Dane, których niezapisana treść nie ma ginąć przy każdym przerysowaniu. */
  const KEEP = ["hc", "hm", "ht", "hl", "paste"];
  const focusSelector = (ae             )         => {
    if (ae.id) return `#${ae.id}`;
    const d = ae.dataset;
    if (!d.act) return "";
    return `[data-act="${d.act}"]` + (d.type ? `[data-type="${d.type}"]` : "") + (d.n ? `[data-n="${d.n}"]` : "") + (d.date ? `[data-date="${d.date}"]` : "") + (d.i ? `[data-i="${d.i}"]` : "") + (d.tab ? `[data-tab="${d.tab}"]` : "");
  };
  const render = ()       => {
    state.today = todayIso();
    const before                                     = { cscroll: $("cscroll")?.scrollLeft, mscroll: $("mscroll")?.scrollLeft };
    const typed = KEEP.map((id) => [id, ($(id)                           )?.value]         );
    // po przerysowaniu fokus wraca na ten sam przycisk (czytnik ekranu i klawiatura nie tracą miejsca)
    const ae = document.activeElement                      ;
    const refocus = ae && ae !== document.body && app.contains(ae) ? focusSelector(ae) : "";
    app.innerHTML = renderTab(state).value;
    for (const [id, v] of typed) { const el = $(id)                           ; if (el && v !== undefined) el.value = v; }
    pickedFile = null;   // pole wyboru pliku jest po przerysowaniu puste, więc stary wybór nie może zostać w pamięci
    if (refocus) app.querySelector             (refocus)?.focus({ preventScroll: true });
    for (const id of ["cscroll", "mscroll"]) {
      const el = $(id);
      if (el) el.scrollLeft = forceEnd || before[id] === undefined ? el.scrollWidth : before[id] ;
    }
    forceEnd = false;
    document.querySelectorAll             (".tabs button").forEach((b) => {
      const on = b.dataset.tab === state.tab;
      b.classList.toggle("on", on);
      if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
  };
  const mutate = (entries         , msg        )       => {
    undo.push(state.db.entries);
    state.db = { ...state.db, entries };
    const ok = persist(); render(); if (ok) toast(msg, true);
  };
  const setSettings = (patch                         )       => {
    state.db = { ...state.db, settings: { ...state.db.settings, ...patch } };
    persist(); render();
  };
  const val = (id        )         => ($(id)                           )?.value.trim() ?? "";
  const segVal = (name        )         => sheet.querySelector             (`[data-seg="${name}"] .on`)?.dataset.v ?? "";

  /* ---------- akcje ---------- */
  const actions                                            = {
    tab: (el) => { state.tab = el.dataset.tab                  ; render(); window.scrollTo(0, 0); },
    "theme-cycle": () => setTheme(nextTheme(state.theme)),
    theme: (el) => setTheme(el.dataset.theme         ),
    prev: () => { state.month = shiftMonth(state.month, -1); render(); },
    next: () => { state.month = shiftMonth(state.month, 1); render(); },
    day: (el) => showSheet(sheetDay(analyze(state.db, state.today), el.dataset.date )),
    close: closeSheet,
    flip: (el) => {
      const was = el.getAttribute("aria-pressed") === "true";
      mutate(toggleEntry(state.db.entries, state.today, el.dataset.type ), (was ? "Usunięto: " : "Dodano: ") + (el.textContent ?? "").trim());
    },
    range: (el) => { state.range = Number(el.dataset.n); state.selCycle = null; forceEnd = true; render(); },
    cyc: (el) => { state.selCycle = Number(el.dataset.i); render(); },
    undo: () => {
      const prev = undo.pop();
      if (!prev) return;
      state.db = { ...state.db, entries: prev }; const ok = persist(); render(); if (ok) toast("Cofnięto");
    },
    "save-day": (el) => {
      const form          = {
        toggles: [...sheet.querySelectorAll             (".tog.on")].map((b) => b.dataset.tog ),
        flow: Number(segVal("Obfitość") || 0), pain: Number(segVal("Ból") || 0),
        limits: ($("lim")                    ).checked, pill: val("pill"), test: segVal("test"), note: val("note"),
        soloType: val("solotype") === "masturb" ? "masturb" : "him",
      };
      closeSheet();
      mutate(saveDay(state.db.entries, el.dataset.date , form), "Zapisane");
    },
    export: () => {
      setSettings({ lastExport: todayIso() });
      download(`luna_backup_${todayIso()}.json`, JSON.stringify(state.db, null, 2), "application/json");
      toast("Kopia pobrana");
    },
    import: () => {
      const go = (text        )       => {
        try { pending = parseBackup(text); showSheet(sheetImport(pending.entries.length, state.db.entries.length, state.host)); }
        catch (err) { toast(err instanceof SyntaxError ? "Import: to nie jest poprawny plik JSON." : `Import: ${(err         ).message}`); }
      };
      if (pickedFile && pickedFile.size > 5_000_000) { toast("Plik jest za duży (limit 5 MB)."); return; }
      if (pickedFile) { const r = new FileReader(); r.onload = () => go(String(r.result)); r.onerror = () => toast("Nie udało się odczytać pliku."); r.readAsText(pickedFile); }
      else if (val("paste")) go(($("paste")                       ).value);
      else toast("Wskaż plik albo wklej JSON");
    },
    merge: () => {
      if (!pending) return;
      const r = mergeDb(state.db, pending);
      undo.push(state.db.entries);
      state.db = { entries: r.entries, cycles: r.cycles, settings: r.settings };
      pending = null; const ok = persist(); closeSheet(); render(); if (ok) toast(`Dodano ${r.added} ${plN(r.added, "nowy wpis", "nowe wpisy", "nowych wpisów")}`, true);
    },
    replace: () => {
      if (!pending) return;
      keepPrevious(store, state.db);
      state.db = pending; pending = null; const ok = persist(); closeSheet(); render(); if (ok) toast(`Wczytano ${state.db.entries.length} ${plN(state.db.entries.length, "wpis", "wpisy", "wpisów")}`);
    },
    health: () => { setSettings({ health: { conditions: val("hc"), meds: val("hm"), tsh: val("ht"), labs: val("hl") } }); toast("Zapisano"); },
    copy: async () => {
      const text = buildBrief(analyze(state.db, state.today), state.db, state.withDates);
      try { await navigator.clipboard.writeText(text); toast("Skopiowano"); } catch { ($("brief")                       ).select(); toast("Zaznacz i skopiuj"); }
    },
    dlb: () => download(`cykl-raport-${todayIso()}.txt`, buildBrief(analyze(state.db, state.today), state.db, state.withDates), "text/plain"),
    wipe: () => showSheet(sheetWipe(state.host)),
    "wipe-yes": () => { keepPrevious(store, state.db); state.db = emptyDb(); const ok = persist(); closeSheet(); render(); if (ok) toast("Usunięto"); },
  };

  document.addEventListener("click", (e) => {
    const target = e.target           ;
    if (target.closest("#mask")) { closeSheet(); return; }
    const tog = target.closest             ("[data-tog]");
    if (tog) { const on = tog.classList.toggle("on"); tog.setAttribute("aria-pressed", String(on)); return; }
    const segBtn = target.closest             (".seg button");
    if (segBtn) {
      const group = segBtn.parentElement ;
      const was = segBtn.classList.contains("on");
      group.querySelectorAll("button").forEach((b) => { b.classList.remove("on"); b.setAttribute("aria-pressed", "false"); });
      if (!(was && group.dataset.seg !== "test")) { segBtn.classList.add("on"); segBtn.setAttribute("aria-pressed", "true"); }
      return;
    }
    const el = target.closest             ("[data-act]");
    if (el) actions[el.dataset.act ]?.(el);
  });
  document.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && (e.target           ).closest?.("g[data-act]")) { e.preventDefault(); ((e.target           ).closest("g[data-act]")                          ).dispatchEvent(new MouseEvent("click", { bubbles: true })); }
    if (e.key === "Escape") closeSheet();
  });
  document.addEventListener("change", (e) => {
    const el = e.target                    ;
    switch (el.dataset.change) {
      case "age": setSettings({ ageBand: el.value }); break;
      case "mode": setSettings({ mode: el.value }); break;
      case "luteal": setSettings({ lutealDays: Number(el.value) }); break;
      case "dates": state.withDates = el.checked; render(); break;
      case "file": pickedFile = el.files?.[0] ?? null; break;
    }
  });

  /* przesunięcie palcem w kalendarzu */
  let sx = 0, sy = 0, swiping = false;
  document.addEventListener("touchstart", (e) => {
    swiping = Boolean((e.target           ).closest("#cal"));
    if (swiping) { sx = e.touches[0] .clientX; sy = e.touches[0] .clientY; }
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (!swiping) return;
    swiping = false;
    const dx = e.changedTouches[0] .clientX - sx, dy = e.changedTouches[0] .clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 40) { state.month = shiftMonth(state.month, dx < 0 ? 1 : -1); render(); }
  });

  applyTheme();
  render();
  if (embedded) window.parent.postMessage({ type: "cykl-ready" }, "*");
  try { void navigator.storage?.persist?.(); } catch { /* brak wsparcia */ }
  void KEY;
};


start();

})();
</script>
